<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO LA MIA STEREO ONLINE</title>
<style>
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#050816;display:flex;justify-content:center;align-items:center;padding:45px 12px;font-family:Arial;overflow-y:auto}
.player{width:100%;max-width:410px;background:#0a0a1f;border:2px solid #00ffff;border-radius:26px;box-shadow:0 0 30px #00ffff,0 0 60px #ff00ff44,0 20px 50px #000;color:#fff;text-align:center;position:relative;flex-shrink:0;margin:auto}
.img-box{height:520px;position:relative;overflow:hidden;background:#000;border-radius:24px 24px 0 0}
.img-box img{width:100%;height:100%;object-fit:cover}
.titles{position:absolute;top:14px;left:0;right:0;z-index:4}
.titles a{text-decoration:none}
.titles h1{margin:0;color:#aaffff;font-size:19px;text-shadow:0 0 12px #00ffff;cursor:pointer}
.titles h2{margin:2px 0 0;color:#fff;font-size:12px;letter-spacing:4px;background:#00000077;display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid #ff00ff55}
.radio-linea{position:absolute;bottom:100px;left:0;right:0;color:#fff;font-weight:bold;font-size:27px;letter-spacing:1px;text-shadow:0 0 15px #00ffff,0 0 30px #ff00ff,0 0 45px #00ffff;z-index:5;text-transform:uppercase}
.content{padding:14px 12px 22px;background:linear-gradient(180deg,#0f0c29,#1e1440);border-radius:0 0 24px 24px}
.now{margin:0 0 6px;padding:10px;background:#000000bb;border-radius:12px;border:1px solid #00ffff55;overflow:hidden}
#songTitleWrap{overflow:hidden;white-space:nowrap;height:18px}
#songTitle{display:inline-block;padding-left:100%;white-space:nowrap;font-weight:bold;font-size:13px;animation:scroll 14s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#artist{color:#ff7bff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-mini{display:flex;justify-content:center;align-items:end;gap:3px;height:22px;margin:10px 0 8px}
.eq-mini .bar{width:4px;height:6px;background:linear-gradient(to top,#00ffff,#ff00ff);border-radius:2px 2px 0 0}
.btns{display:flex;justify-content:center;gap:14px;margin-top:8px}
.play{border:3px solid #ff00ff;background:radial-gradient(circle,#2a2a5a,#0a0a1f);width:72px;height:72px;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 0 20px #ff00ff;color:#fff}
.chatBtn{border:2px solid #00ffff;background:radial-gradient(circle,#0a2a3a,#0a0a1f);width:72px;height:72px;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 0 15px #00ffff;color:#fff}
.linkPrincipal{margin-top:14px;display:inline-block;color:#00ffff;font-size:11px;text-decoration:none;border:1px solid #00ffff55;background:#00000088;padding:7px 16px;border-radius:20px;letter-spacing:1px;transition:0.2s}
.linkPrincipal:hover{background:#00ffff22;box-shadow:0 0 12px #00ffff;color:#fff}
canvas{position:absolute;left:0;width:100%;z-index:3;pointer-events:none}
#waveMiddle{top:50%;height:90px;transform:translateY(-50%)}
.chatWindow{position:absolute;bottom:0;left:0;right:0;height:88%;background:#0a0a1f;border-top:2px solid #00ffff;border-radius:20px 20px 0 0;z-index:30;transform:translateY(100%);transition:0.35s;display:flex;flex-direction:column}
.chatWindow.open{transform:translateY(0)}
.chatHeader{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#0a0a1f,#1e1440);border-bottom:1px solid #00ffff55;border-radius:20px 20px 0 0}
.closeChat{background:none;border:1px solid #ff00ff;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
.chatFrame{flex:1;border:none;width:100%;background:#fff}
.onlineDot{width:8px;height:8px;background:#00ff00;border-radius:50%;box-shadow:0 0 8px #00ff00;display:inline-block;margin-right:4px}
@media (max-width:600px){body{padding:35px 10px 55px}.player{max-width:100%}.img-box{height:52vh;min-height:430px;max-height:560px}.radio-linea{font-size:26px;bottom:16%}}
@media (min-width:601px){body{background:radial-gradient(ellipse at center,#1a1a3a 0%,#050816 75%);padding:60px 20px}}
</style>
</head>
<body>
  <div class="player">
    <div class="img-box">
      <img src="dj.jpg" alt="RADIO LA MIA STEREO ONLINE">
      <canvas id="waveMiddle"></canvas>
      <div class="titles">
        <a href="https://radiolamiastereo.github.io/" target="_blank" rel="noopener"><h1>RADIO LA MIA STEREO</h1></a>
        <h2>ONLINE</h2>
      </div>
      <div class="radio-linea">Radio en Línea</div>
      <div class="chatWindow" id="chatWindow">
        <div class="chatHeader"><div><h3><span class="onlineDot"></span>CHAT OFICIAL</h3><small style="color:#ff7bff;font-size:9px">RADIO LA MIA STEREO</small></div><button class="closeChat" onclick="toggleChat()">✕</button></div>
        <iframe class="chatFrame" src="https://my.cbox.ws/Chat-Radio-La-Mia-st"></iframe>
      </div>
    </div>
    <div class="content">
      <div class="now"><small style="color:#00ffff;font-size:8px;letter-spacing:2px">♪ TEMA ACTUAL</small><div id="songTitleWrap"><div id="songTitle">Toca Play para activar ondas • RADIO LA MIA STEREO • Radio en Línea</div></div><div id="artist">RADIO LA MIA STEREO ONLINE</div></div>
      <div class="eq-mini" id="eqMini"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <div class="btns"><button class="play" id="btn" onclick="toggleRadio()">▶️</button><button class="chatBtn" onclick="toggleChat()">💬</button></div>
      
      <!-- SOLO TEXTO LINK A PAGINA PRINCIPAL -->
      <a class="linkPrincipal" href="https://radiolamiastereo.github.io/" target="_blank" rel="noopener">🌐 radiolamiastereo.github.io</a>
      
      <p style="font-size:9px;color:#aaa;margin-top:10px"><span class="onlineDot"></span> RADIO EN LÍNEA</p>
      <audio id="radio" crossorigin="anonymous" preload="none"><source src="https://stream.zeno.fm/mys646fkd2zuv" type="audio/mpeg"></audio>
    </div>
  </div>
<script>
let playing=false,audioCtx,analyser,dataArray,timeArray;
const audio=document.getElementById('radio'),btn=document.getElementById('btn'),waveCanvas=document.getElementById('waveMiddle'),wCtx=waveCanvas.getContext('2d'),eqBars=document.querySelectorAll('#eqMini .bar');
function resize(){waveCanvas.width=waveCanvas.offsetWidth*2;waveCanvas.height=waveCanvas.offsetHeight*2;}window.addEventListener('resize',resize);resize();
function toggleRadio(){if(!playing){audio.play().then(()=>{btn.textContent="⏸️";playing=true;if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();const src=audioCtx.createMediaElementSource(audio);src.connect(analyser);analyser.connect(audioCtx.destination);analyser.fftSize=512;dataArray=new Uint8Array(analyser.frequencyBinCount);timeArray=new Uint8Array(analyser.fftSize);draw();}});}else{audio.pause();btn.textContent="▶️";playing=false;}}
function draw(){requestAnimationFrame(draw);if(!playing)return;analyser.getByteFrequencyData(dataArray);analyser.getByteTimeDomainData(timeArray);for(let i=0;i<eqBars.length;i++){eqBars[i].style.height=(4+dataArray[i*3+2]/255*18)+'px';}wCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height);const h=waveCanvas.height,w=waveCanvas.width,cy=h/2;wCtx.beginPath();wCtx.lineWidth=3;wCtx.strokeStyle='#00ffff';wCtx.shadowColor='#00ffff';wCtx.shadowBlur=18;for(let x=0;x<w;x++){const i=Math.floor(x/w*timeArray.length);const y=cy+(timeArray[i]-128)/128*(30+dataArray[5]/70*18)+Math.sin(x*0.01+Date.now()/300)*3;if(x==0)wCtx.moveTo(x,y);else wCtx.lineTo(x,y);}wCtx.stroke();wCtx.shadowBlur=0;wCtx.beginPath();wCtx.lineWidth=2;wCtx.strokeStyle='rgba(255,0,255,0.85)';wCtx.shadowColor='#ff00ff';wCtx.shadowBlur=14;for(let x=0;x<w;x++){const i=Math.floor(x/w*timeArray.length);const y=cy+(timeArray[i+50]-128)/128*22+Math.sin(x*0.012-Date.now()/280)*4;if(x==0)wCtx.moveTo(x,y);else wCtx.lineTo(x,y);}wCtx.stroke();wCtx.shadowBlur=0;}
function toggleChat(){document.getElementById('chatWindow').classList.toggle('open');}
const songEl=document.getElementById('songTitle'),artistEl=document.getElementById('artist'),mountId="mys646fkd2zuv";
function updateScroll(t){songEl.style.animation='none';songEl.offsetHeight;songEl.textContent=t+"   •   "+t+"   •   RADIO LA MIA STEREO   •   ";songEl.style.animation='scroll 14s linear infinite';}
try{const es=new EventSource(`https://api.zeno.fm/mounts/metadata/subscribe/${mountId}`);es.onmessage=e=>{try{const d=JSON.parse(e.data);let t=d.streamTitle||d.title||"";if(t){let p=t.split(" - ");if(p.length>=2){artistEl.textContent=p[0];updateScroll(p.slice(1).join(" - "));}else{artistEl.textContent="RADIO LA MIA";updateScroll(t);}}}catch{}};}catch{}
</script>
</body>
</html>
