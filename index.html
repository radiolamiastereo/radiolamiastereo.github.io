html<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio La Mia Stereo Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#050816;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
.player{width:92%;max-width:380px;background:#0f0c29;border:2px solid #00ffff;border-radius:22px;overflow:hidden;box-shadow:0 0 30px #ff00ff55;text-align:center;color:#fff}
.img-box{height:380px;position:relative}
.img-box img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:#ff2a6d;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.content{padding:20px;background:linear-gradient(180deg,#0f0c29,#302b63)}
.logo{color:#00ffff;font-weight:bold;margin:0;font-size:20px}
.play{background:#00ffff;border:none;width:85px;height:85px;border-radius:50%;font-size:38px;cursor:pointer;box-shadow:0 0 20px #00ffff;margin:15px}
</style>
</head>
<body>
<div class="player">
  <div class="img-box">
    <!-- CAMBIA EL NOMBRE DE LA FOTO SI ES NECESARIO -->
    <img src="dj.jpg" alt="DJ Radio La Mia Stereo">
    <div class="badge">● EN VIVO</div>
  </div>
  <div class="content">
    <p class="logo">RADIO LA MIA STEREO ONLINE</p>
    <p style="color:#ff7bff;margin:5px 0">ONLINE • EN VIVO</p>
    <button class="play" id="btn" onclick="toggleRadio()">▶️</button>
    <p id="txt" style="font-size:13px;color:#ccc">Toca Play para escuchar</p>
    <audio id="radio" preload="none">
      <source src="https://stream.zeno.fm/mys646fkd2zuv" type="audio/mpeg">
    </audio>
  </div>
</div>

<script>
let playing=false;
const audio=document.getElementById('radio');
const btn=document.getElementById('btn');
const txt=document.getElementById('txt');
function toggleRadio(){
  if(!playing){
    audio.play().then(()=>{
      btn.textContent="⏸️";
      txt.innerHTML="🔊 Sonando en vivo";
      playing=true;
    });
  }else{
    audio.pause();
    btn.textContent="▶️";
    txt.innerHTML="Pausado";
    playing=false;
  }
}
</script>
</body>
</html>
