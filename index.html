<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Radio La Mia Stereo - En Vivo</title>
<link rel="preconnect" href="https://stream.zeno.fm">
<link rel="preconnect" href="https://api.zeno.fm">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--c1:#00e5ff;--c2:#ff00aa;--bg:#060816}
html,body{height:100%;width:100%;overflow-x:hidden}
body{
  background:
  radial-gradient(600px 300px at 20% 0%, #00e5ff55 0%, transparent 60%),
  radial-gradient(600px 300px at 90% 100%, #ff00aa33 0%, transparent 60%),
  linear-gradient(180deg,#00e5ff 0%, #004466 28%, #02030a 62%, #000000 100%);
  font-family:system-ui,-apple-system,Arial;
  display:grid;place-items:center;
  overflow:hidden;color:#fff;
}
.card{
  width:min(420px,94vw);height:min(720px,94svh);
  background:linear-gradient(180deg,#12142e 0%,#0a0c22 100%);
  border:1px solid #ffffff22;border-radius:28px;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  contain:content;
}
.top{padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:10px;letter-spacing:2px;background:#ff003322;border:1px solid #ff0033;color:#ff5577;padding:5px 10px;border-radius:99px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;background:#ff2d55;border-radius:50%;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.listen{font-size:11px;color:#aaa}
.listen b{color:#fff}
.cover{margin:16px 16px 0;height:40%;border-radius:20px;position:relative;overflow:hidden;background:#000;contain:strict}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transform:translateZ(0)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#0a0c22 100%)}
.cover-info{position:absolute;left:14px;bottom:12px;z-index:2;right:14px}
.cover-info h1{font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 2px 10px #000}
.cover-info p{font-size:12px;color:#00e5ff;margin-top:4px;font-weight:700;letter-spacing:2px}
.live-tag{position:absolute;top:12px;right:12px;z-index:2;background:#000000aa;padding:5px 10px;border-radius:99px;font-size:10px;letter-spacing:1px}
.marquee{overflow:hidden;white-space:nowrap;margin:12px 16px 0;height:22px;display:flex;align-items:center;justify-content:center}
.marquee span{
  display:inline-block;will-change:transform;
  font-size:14px;font-weight:700;color:#fff;
  animation:vaiven 7s ease-in-out infinite alternate;
}
@keyframes vaiven{
  0%{transform:translateX(15%)}
  15%{transform:translateX(15%)}
  85%{transform:translateX(-15%)}
  100%{transform:translateX(-15%)}
}
.marquee span.corto{animation:none}
.wave-box{margin:8px 16px 2px;height:84px;position:relative;overflow:visible}
.wave-box canvas{width:100%;height:100%;display:block}
.paused .wave-box{opacity:.4}
.controls-wrap{position:relative;z-index:60;background:linear-gradient(180deg,#12142e 0%,#0a0c22 100%);padding-top:2px}
.controls{padding:8px 16px 0;display:flex;align-items:center;justify-content:center;gap:18px}
.btn{width:52px;height:52px;border-radius:50%;border:1px solid #ffffff33;background:#ffffff10;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:transform .15s;position:relative}
.btn:active{transform:scale(.92)}
.play-main{width:74px;height:74px;font-size:28px;color:#fff;background:linear-gradient(135deg,#00e5ff,#ff00aa);border:none;position:relative}
.play-main::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #ffffff33}
.tip{position:relative}
.tip::after{
  content:attr(data-tip);
  position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) translateY(4px);
  background:#fff;color:#000;font-size:11px;font-weight:800;white-space:nowrap;
  padding:6px 10px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:10;
}
.tip::before{
  content:"";position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#fff;opacity:0;transition:opacity .2s;z-index:10;pointer-events:none;
}
.tip:hover::after,.tip:hover::before,.tip:active::after,.tip:active::before,.tip.show::after,.tip.show::before{opacity:1;transform:translateX(-50%) translateY(0)}
.progress{margin:14px 16px 0;height:4px;background:#ffffff1a;border-radius:99px;overflow:hidden}
#fill{height:100%;width:0%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .4s}
.row{margin:8px 16px 0;display:flex;justify-content:space-between;font-size:11px;color:#888}
#status{color:var(--c1);font-weight:700;letter-spacing:1px}
.actions{margin:auto 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions a,.actions button{padding:13px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:13px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;position:relative}
.actions .dl{background:#00ff88;color:#04120a;border:none}
.footer{text-align:center;font-size:10px;color:#555;padding-bottom:10px;letter-spacing:1px}

/* ===== CHAT QUE SÍ SE AJUSTA AL CELULAR - SIN TRUCOS ===== */
.chat-panel{
  position:fixed;
  left:0;right:0;top:0;bottom:0;
  width:100vw;max-width:100vw;
  height:100dvh;height:100svh;
  background:
  radial-gradient(500px 220px at 50% 0%, #00e5ff66 0%, transparent 65%),
  linear-gradient(180deg,#00e5ff 0%, #005a7a 22%, #02030a 58%, #000000 100%);
  z-index:999;
  display:flex;flex-direction:column;
  transform:translateY(105%);
  transition:transform .45s cubic-bezier(.2,.9,.3,1), visibility 0s linear .45s;
  visibility:hidden;
  will-change:transform;
  overflow:hidden;
}
.chat-panel.open{
  transform:translateY(0);
  visibility:visible;
  transition:transform .45s cubic-bezier(.2,.9,.3,1), visibility 0s linear 0s;
}
.chat-head{
  width:100%;max-width:100vw;
  padding:12px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(90deg,#00e5ff33,#ff00aa22);
  border-bottom:1px solid #ffffff22;
  flex-shrink:0;
  padding-top:max(12px, env(safe-area-inset-top));
}
.chat-head b{font-size:13px;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px #000}
.chat-head span{font-size:11px;color:#00ff88;flex-shrink:0}
.chat-mini-play{
  width:40px;height:40px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,#00e5ff,#ff00aa);color:#fff;font-size:17px;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 0 14px #00e5ff88;
}
.chat-mini-play:active{transform:scale(.92)}
.chat-close{
  width:40px;height:40px;border-radius:50%;border:none;flex-shrink:0;
  background:#ffffff1a;color:#fff;font-size:17px;cursor:pointer;
  display:grid;place-items:center;
}
.chat-close:active{transform:scale(.9)}
.chat-frame-wrap{
  flex:1;min-height:0;
  width:100%;max-width:100vw;
  overflow:hidden;
  background:#000;
  padding:0;margin:0;
  display:flex;flex-direction:column;
}
/* AQUÍ ESTÁ EL ARREGLO: 100% exacto, sin 182%, sin margin negativo */
.chat-frame{
  display:block;border:none;background:#fff;
  width:100% !important;
  max-width:100vw !important;
  min-width:0 !important;
  margin:0 !important;
  padding:0;
  flex:1;
  height:100%;
  min-height:0;
  border-radius:0;
  box-shadow:none;
}
</style></head>
<body>

<div class="card paused" id="card">
  <div class="top">
    <div class="badge"><span class="dot"></span> EN VIVO</div>
    <div class="listen">📻 <b id="oyentes">1,248</b> escuchando</div>
  </div>

  <div class="cover">
    <img src="https://radiolamiastereo.github.io/logo.webp" onerror="this.src='https://radiolamiastereo.github.io/logo.png'" alt="Radio La Mia" fetchpriority="high" decoding="async">
    <div class="live-tag">GUAYAQUIL • EC</div>
    <div class="cover-info"><h1>Radio La Mia<br>Stereo</h1><p>DJ ALFA</p></div>
  </div>

  <div class="marquee"><span id="song">🎵 CONECTANDO CON ZENO... 🎵</span></div>

  <div class="wave-box"><canvas id="waveCanvas" width="360" height="84"></canvas></div>

  <div class="controls-wrap">
    <div class="controls">
      <button class="btn tip" data-tip="Compartir radio" onclick="compartir()">↗️</button>
      <button class="btn play-main tip" id="playBtn" data-tip="Toca para escuchar">▶️</button>
      <button class="btn tip" id="chatBtn" data-tip="Chat en vivo">👥</button>
      <button class="btn tip" id="volBtn" data-tip="Silencio / Sonido">🔊</button>
    </div>

    <div class="progress"><div id="fill"></div></div>
    <div class="row"><span id="status">TOCA PLAY PARA ESCUCHAR</span><span>ZENOFM • 128KBPS</span></div>

    <div class="actions">
      <a href="https://radiolamiastereo.github.io/RadioLamiaV2.apk" class="tip" data-tip="Instalar la App en tu celular">📥 DESCARGAR APP</a>
      <button class="tip" data-tip="Enviar a tus amigos" onclick="compartir()">📲 COMPARTIR RADIO</button>
    </div>
    <div class="footer">RADIO LA MIA STEREO © 2026 • HECHO EN GUAYAQUIL</div>
  </div>
</div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <span>●</span><b>CHAT EN VIVO - RADIO LA MIA</b>
    <button class="chat-mini-play" id="chatPlayBtn">▶️</button>
    <button class="chat-close" id="chatClose">✕</button>
  </div>
  <div class="chat-frame-wrap" id="chatWrap">
    <iframe id="chatFrame" class="chat-frame" src="" title="Chat en vivo" loading="lazy" scrolling="yes" allow="clipboard-write"></iframe>
  </div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous" src="https://stream.zeno.fm/mys646fkd2zuv"></audio>

<script>
let a=document.getElementById('audio'),btn=document.getElementById('playBtn'),card=document.getElementById('card'),status=document.getElementById('status'),fill=document.getElementById('fill'),vol=document.getElementById('volBtn');
let playing=false;

let chatPanel=document.getElementById('chatPanel'), chatFrame=document.getElementById('chatFrame'), chatBtn=document.getElementById('chatBtn'), chatClose=document.getElementById('chatClose'), chatPlayBtn=document.getElementById('chatPlayBtn'), chatWrap=document.getElementById('chatWrap');
let chatCargado=false;
function abrirChat(){
  chatPanel.classList.add('open');
  document.body.style.overflow='hidden';
  chatBtn.textContent='💬';
  if(!chatCargado){ chatFrame.src='https://my.cbox.ws/Chat-Radio-La-Mia-st'; chatCargado=true; }
}
function cerrarChat(){
  chatPanel.classList.remove('open');
  document.body.style.overflow='';
  chatBtn.textContent='👥';
}
chatBtn.onclick=()=>{ if(chatPanel.classList.contains('open')) cerrarChat(); else abrirChat(); };
chatClose.onclick=cerrarChat;

let canvas=document.getElementById('waveCanvas');
let ctx=canvas.getContext('2d');
let audioCtx=null, analyser=null, dataArray=null;
let rafId=null, t=0;
let amp1=3, amp2=3, amp3=3;

function dibujarOndas(bajo, medio, agudo){
  let W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  t += 0.10;
  amp1 += (bajo - amp1)*0.85;
  amp2 += (medio - amp2)*0.85;
  amp3 += (agudo - amp3)*0.85;
  let ondas=[
    {color:'#00e5ff', amp:amp1, freq:0.045, fase:t, grosor:2.6},
    {color:'#ff00aa', amp:amp2, freq:0.06, fase:t*1.05, grosor:2.1},
    {color:'#00ff88', amp:amp3, freq:0.075, fase:t*1.1, grosor:1.7},
  ];
  ondas.forEach(o=>{
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){
      let y = H/2 + Math.sin(x*o.freq + o.fase) * o.amp;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=o.color;
    ctx.lineWidth=o.grosor;
    ctx.lineCap='round';
    ctx.stroke();
  });
}
function dibujarPlano(){
  let W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();
  ctx.moveTo(0,H/2); ctx.lineTo(W,H/2);
  ctx.strokeStyle='#ffffff33'; ctx.lineWidth=1.5; ctx.stroke();
}
dibujarPlano();

function loopOndas(){
  if(!playing) return;
  if(analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    let nBajo = dataArray[2]/255;
    let nMedio = dataArray[10]/255;
    let nAgudo = dataArray[20]/255;
    let bajo = Math.min(Math.pow(nBajo, 1.5) * 38 + 1, 36);
    let medio = Math.min(Math.pow(nMedio, 1.5) * 30 + 1, 32);
    let agudo = Math.min(Math.pow(nAgudo, 1.5) * 22 + 0.5, 28);
    dibujarOndas(bajo, medio, agudo);
  } else {
    dibujarOndas(4+Math.random()*10, 4+Math.random()*8, 3+Math.random()*6);
  }
  rafId = requestAnimationFrame(loopOndas);
}

function iniciarOndas(){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let source = audioCtx.createMediaElementSource(a);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.15;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loopOndas);
  }catch(e){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loopOndas);
  }
}
function pararOndas(){
  if(rafId) cancelAnimationFrame(rafId);
  dibujarPlano();
}

async function togglePlay(){
  if(!playing){
    status.textContent='CONECTANDO...';fill.style.width='25%';
    try{await a.play();playing=true;btn.textContent='⏸️';chatPlayBtn.textContent='⏸️';btn.setAttribute('data-tip','Pausar radio');card.classList.remove('paused');status.textContent='● EN VIVO - SONANDO';fill.style.width='100%';iniciarOndas();}
    catch(e){status.textContent='TOCA DE NUEVO PARA SONAR';}
  }else{a.pause();playing=false;btn.textContent='▶️';chatPlayBtn.textContent='▶️';btn.setAttribute('data-tip','Toca para escuchar');card.classList.add('paused');status.textContent='PAUSADO';fill.style.width='0%';pararOndas();}
}
btn.onclick=togglePlay;
chatPlayBtn.onclick=togglePlay;
vol.onclick=()=>{a.muted=!a.muted;vol.textContent=a.muted?'🔇':'🔊';vol.setAttribute('data-tip',a.muted?'Activar sonido':'Silencio / Sonido');};
function compartir(){if(navigator.share){navigator.share({title:'Radio La Mia Stereo',text:'Escucha Radio La Mia Stereo en vivo',url:location.href})}else{prompt('Copia el link:',location.href)}}
setInterval(()=>{document.getElementById('oyentes').textContent=(1200+Math.floor(Math.random()*80)).toLocaleString()},10000);
a.addEventListener('waiting',()=>{if(playing)status.textContent='CARGANDO BUFFER...'});
a.addEventListener('playing',()=>{status.textContent='● EN VIVO - SONANDO';fill.style.width='100%'});
document.querySelectorAll('.tip').forEach(el=>{
  el.addEventListener('touchstart',()=>{el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)},{passive:true});
});

let songEl=document.getElementById('song');
let lastSong='';
function setSong(txt){
  txt=(txt||'').trim();
  if(!txt) return;
  if(txt===lastSong) return;
  if(txt.toLowerCase().includes('radio la mia') && txt.length < 30){
    songEl.textContent='🎵 RADIO LA MIA STEREO - EN VIVO 🎵';
    songEl.classList.add('corto');
    return;
  }
  lastSong=txt;
  songEl.style.animation='none';
  songEl.textContent='🎵 '+txt+' 🎵';
  songEl.classList.toggle('corto', txt.length < 28);
  void songEl.offsetWidth;
  songEl.style.animation='';
  document.title = txt + ' - Radio La Mia Stereo';
}
function conectarZeno(){
  let es = new EventSource('https://api.zeno.fm/mounts/metadata/subscribe/mys646fkd2zuv');
  es.onmessage = (e)=>{
    try{
      let data = JSON.parse(e.data);
      let titulo = data.streamTitle || data.title || data.song || data.now_playing || '';
      if(typeof titulo === 'object') titulo = titulo.title || titulo.song || '';
      if(titulo) setSong(titulo);
      if(data.metadata && data.metadata.streamTitle) setSong(data.metadata.streamTitle);
    }catch(err){
      if(e.data && e.data.length > 2 && !e.data.includes('{')) setSong(e.data);
    }
  };
  es.onerror = ()=>{
    es.close();
    songEl.textContent='🎵 RADIO LA MIA STEREO - EN VIVO 🎵';
    setTimeout(conectarZeno, 5000);
  };
}
conectarZeno();
</script>
</body></html>
