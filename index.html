<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metadata Zeno Radio</title>
</head>
<body>

    <div id="radio-player">
        <h3>Escuchando ahora:</h3>
        <p id="track-title">Cargando canción...</p>
    </div>

    <script>
        // Reemplaza "tu_mount_id_aqui" por la clave de tu estación
        const zenoKey = "mys646fkd2zuv"; 
        const streamUrl = `https://zeno.fm{zenoKey}`;

        // Iniciar la conexión en tiempo real
        const eventSource = new EventSource(streamUrl);

        eventSource.onmessage = function(event) {
            try {
                // Zeno envía los datos en formato JSON
                const data = JSON.parse(event.data);
                
                // Extraer el título de la canción/transmisión
                if (data.streamTitle) {
                    document.getElementById('track-title').innerText = data.streamTitle;
                }
            } catch (error) {
                console.error("Error al procesar la metadata:", error);
            }
        };

        eventSource.onerror = function(err) {
            console.error("Error en la conexión de EventSource. Reintentando...", err);
        };
    </script>
</body>
</html>
