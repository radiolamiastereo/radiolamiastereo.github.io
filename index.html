<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RADIO LA MIA STEREO ONLINE - DJ ALFA EN VIVO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#050816;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
.player{width:94%;max-width:410px;background:#0a0a1f;border:2px solid #00ffff;border-radius:24px;overflow:hidden;box-shadow:0 0 25px #00ffff,0 0 50px #ff00ff66;text-align:center;color:#fff;position:relative}
.img-box{height:540px;position:relative;overflow:hidden;background:#000}
.img-box img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.titles{position:absolute;top:20px;left:0;right:0;z-index:4}
.titles h1{margin:0;color:#aaffff;font-size:22px;text-shadow:0 0 12px #00ffff,0 0 25px #ff00ff;letter-spacing:1px}
.titles h2{margin:4px 0 0;color:#fff;font-size:15px;letter-spacing:4px;text-shadow:0 0 8px #ff00ff;background:#00000066;display:inline-block;padding:4px 12px;border-radius:20px;border:1px solid #ff00ff55}
.djname{position:absolute;bottom:92px;left:0;right:0;color:#fff;font-weight:bold;font-size:28px;text-shadow:0 0 15px #ff00ff,0 0 30px #00ffff;letter-spacing:2px;z-index:4}
.wave{position:absolute;top:52%;left:50%;border:2px solid #00ffff;border-radius:50%;transform:translate(-50%,-50%);opacity:0;z-index:2}
.playing .wave{animation:wave 2.2s infinite}
@keyframes wave{0%{width:0;height:0;opacity:.9}100%{width:520px;height:520px;opacity:0}}
.content{padding:12px;background:linear-gradient(180deg,#0f0c29,#1e1440)}
.now{margin:0 0 10px;padding:10px;background:#000000bb;border-radius:12px;border:1px solid #00ffff55}
#songTitle{color:#fff;font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:#ff7bff;font-size:11px}
.eq{display:flex;justify-content:center;align-items:end;gap:3px;height:42px;margin:10px 0}
.bar{width:8px;background:linear-gradient(to top,#00ffff,#ff00ff);border-radius:4px 4px 0 0}
.playing .bar{animation:eq .5s infinite alternate}
@keyframes eq{0%{height:8px}100%{height:42px}}
.play{border:3px solid #ff00ff;background:radial-gradient(circle,#2a2a5a,#0a0a1f);width:76px;height:76px;border-radius:50%;font-size:32px;cursor:pointer;box-shadow:0 0 20px #ff00ff;color:#fff;z-index:4;position:relative}
canvas#visual{position:absolute;bottom:0;left:0;width:100%;height:75px;opacity:.7;z-index:3}
</style>
</head>
<body>
<div class="player" id="playerBox">
  <div class="img-box" id="imgBox">
    <img src="dj.jpg" alt="RADIO LA MIA STEREO ONLINE">
    <div class="wave"></div><div class="wave"></div>
    <div class="titles">
      <h1>RADIO LA MIA STEREO</h1>
      <h2>ONLINE</h2>
    </div>
    <div class="djname">DJ ALFA EN VIVO</div>
    <canvas id="visual"></canvas>
  </div>
  <div class="content">
    <div class="now">
      <small style="color:#00ffff;letter-spacing:2px;font-size:9px">♪ TEMA ACTUAL</small>
      <div id="songTitle">Cargando tema...</div>
      <div id="artist">RADIO LA MIA STEREO ONLINE</div>
    </div>
    <div class="eq">
      <div class="bar" style="height:12px"></div><div class="bar" style="height:22px"></div><div class="bar" style="height:36px"></div><div class="bar" style="height:16px"></div><div class="bar" style="height:28px"></div><div class="bar" style="height:10px"></div><div class="bar" style="height:32px"></div><div class="bar" style="height:18px"></div><div class="bar" style="height:26px"></div><div class="bar" style="height:12px"></div>
    </div>
    <button class="play" id="btn" onclick="toggleRadio()">▶️</button>
    <p id="status" style="font-size:10px;color:#aaa">RADIO LA MIA STEREO ONLINE • DJ ALFA EN VIVO</p>
    <audio id="radio" crossorigin="anonymous" preload="none">
      <source src="https://stream.zeno.fm/mys646fkd2zuv" type="audio/mpeg">
    </audio>
  </div>
</div>

<script>
let playing=false;
const audio=document.getElementById('radio'), btn=document.getElementById('btn'), box=document.getElementById('playerBox'), imgBox=document.getElementById('imgBox');
let audioCtx, analyser;
function toggleRadio(){
 if(!playing){
  audio.play().then(()=>{btn.textContent="⏸️"; playing=true; box.classList.add('playing'); imgBox.classList.add('playing');});
 }else{audio.pause(); btn.textContent="▶️"; playing=false; box.classList.remove('playing'); imgBox.classList.remove('playing');}
}
const songEl=document.getElementById('songTitle'), artistEl=document.getElementById('artist');
const mountId="mys646fkd2zuv";
try{
  const es=new EventSource(`https://api.zeno.fm/mounts/metadata/subscribe/${mountId}`);
  es.onmessage=e=>{try{const d=JSON.parse(e.data);let t=d.streamTitle||d.title||"";if(t){let p=t.split(" - ");if(p.length>=2){artistEl.textContent=p[0]; songEl.textContent=p.slice(1).join(" - ");}else{songEl.textContent=t;}}}catch{}};
}catch{}
setTimeout(()=>{if(songEl.textContent==="Cargando tema..."){songEl.textContent="DJ ALFA Mezclando en Vivo";artistEl.textContent="RADIO LA MIA STEREO ONLINE";}},4000);
</script>
</body>
</html>
